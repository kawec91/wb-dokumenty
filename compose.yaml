services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wbdokumenty
      POSTGRES_USER: wbdokumenty
      POSTGRES_PASSWORD: local-only-change-me
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbdokumenty"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - document-storage:/data/whitebull-drive/Księgowość
volumes:
  postgres-data:
  document-storage:
